<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Rounded Modern App Icon Box -->
  <rect width="64" height="64" rx="16" fill="url(#grad)" />

  <!-- Inner subtle border -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.3" />

  <!-- Code Brackets & RS Monogram for Frontend Developer -->
  <!-- Left Bracket < -->
  <path d="M 17 24 L 11 32 L 17 40" fill="none" stroke="#e0e7ff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.85" />
  
  <!-- Right Bracket > -->
  <path d="M 47 24 L 53 32 L 47 40" fill="none" stroke="#e0e7ff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.85" />

  <!-- Center RS Text -->
  <text x="32" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="900" fill="#ffffff" text-anchor="middle" filter="url(#glow)" letter-spacing="-0.5">RS</text>

  <!-- Active Developer Dot Indicator -->
  <circle cx="50" cy="14" r="3.5" fill="#34d399" stroke="#ffffff" stroke-width="1" />
</svg>
